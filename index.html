<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Concert Watch</title>
<style>
:root{--bg:#faf9f7;--panel:#fff;--ink:#16161a;--muted:#6b6b76;--line:#e7e5e1;--accent:#5b4bdb;--accent-soft:#ece9ff;
--elec:#0f8a6c;--elec-soft:#dcf3ec;--warn:#9a5b00;--warn-soft:#fdf0d8;--today:#fff4d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121216;--panel:#1b1b21;--ink:#ececf1;--muted:#9a9aa6;
--line:#2c2c35;--accent:#a99cff;--accent-soft:#2b2747;--elec:#5fd3b2;--elec-soft:#173a31;--warn:#f0b75c;--warn-soft:#3a2c14;--today:#2e2a1c}}
:root[data-theme="dark"]{--bg:#121216;--panel:#1b1b21;--ink:#ececf1;--muted:#9a9aa6;--line:#2c2c35;--accent:#a99cff;
--accent-soft:#2b2747;--elec:#5fd3b2;--elec-soft:#173a31;--warn:#f0b75c;--warn-soft:#3a2c14;--today:#2e2a1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
h1{font-size:26px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px}
a{color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:8px}
.tab{background:none;border:0;padding:10px 12px;font-size:15px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--ink);font-weight:600}
.month{margin:26px 0}
.month h2{font-size:18px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:0 6px 4px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:92px;padding:6px;overflow:hidden}
.cell.empty{background:transparent;border-color:transparent}
.cell.today{background:var(--today)}
.num{font-size:12px;color:var(--muted)}
.ev{display:block;margin-top:4px;font-size:12px;line-height:1.25;padding:3px 6px;border-radius:5px;background:var(--accent-soft);color:var(--ink);text-decoration:none;cursor:pointer;border:0;width:100%;text-align:left}
.ev.e{background:var(--elec-soft)}
.ev.f{background:var(--warn-soft)}
.ev small{display:block;color:var(--muted)}
.agenda{display:none}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.item h3{margin:0;font-size:16px}
.meta{color:var(--muted);font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:2px}
.tag.new{background:var(--accent-soft);color:var(--accent)}
.tag.pos{background:var(--warn-soft);color:var(--warn)}
.tag.dj{background:var(--elec-soft);color:var(--elec)}
.artists{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:16px}
.artist{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.artist img,.artist .ph{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.artist b{display:block}
.artist .meta{font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);max-width:440px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.35)}
.empty-note{color:var(--muted);padding:24px 0}
@media (max-width:720px){.grid-wrap{display:none}.agenda{display:block}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Concert Watch</h1><div class="sub" id="sub"></div></div>
  <div class="sub"><a href="concerts.ics" id="ics">Subscribe to NYC calendar</a></div>
</header>
<div class="tabs" role="tablist">
  <button class="tab" role="tab" data-tab="cal" aria-selected="true">NYC calendar</button>
  <button class="tab" role="tab" data-tab="artists" aria-selected="false">Artists</button>
  <button class="tab" role="tab" data-tab="tours" aria-selected="false">US &amp; Europe</button>
</div>
<div class="bar" id="filters">
  <button class="chip" data-f="e" aria-pressed="true">Electronic</button>
  <button class="chip" data-f="all" aria-pressed="false">All artists</button>
  <button class="chip" data-f="o" aria-pressed="false">Everyone else</button>
  <button class="chip" data-f="pos" aria-pressed="true">Include possible matches</button>
</div>
<div class="legend"><span><span class="sw" style="background:var(--elec-soft)"></span>Electronic</span>
<span><span class="sw" style="background:var(--accent-soft)"></span>Other</span>
<span><span class="sw" style="background:var(--warn-soft)"></span>Possible match (name in title only)</span></div>
<main id="view"></main>
</div>
<dialog id="dlg"><div id="dlgBody"></div><p style="text-align:right;margin:12px 0 0"><button class="chip" onclick="dlg.close()">Close</button></p></dialog>

 "Amr Diab", "rank": "#38 6 months", "order": 38, "image": "https://i.scdn.co/image/ab6761610000e5eb71f255e69340c2e86a282e8a", "electronic": false, "found": true}, {"name": "Cerrone", "rank": "#38 lifetime", "order": 38, "image": "https://i.scdn.co/image/ab6761610000e5eb4bfd1d1fe4b4da282d823861", "electronic": true, "found": true}, {"name": "Electric Light Orchestra", "rank": "#39 4 weeks", "order": 39, "image": "https://i.scdn.co/image/ab6761610000e5eb6ee22df4403027ae525ced87", "electronic": false, "found": true}, {"name": "Howling", "rank": "#39 6 months", "order": 39, "image": "https://i.scdn.co/image/ab6761610000e5eb3747dcd1d225e9d83910f3e7", "electronic": true, "found": true}, {"name": "Modern Talking", "rank": "#39 lifetime", "order": 39, "image": "https://i.scdn.co/image/ab6761610000e5eb763481abe93a755de038db8b", "electronic": true, "found": true}, {"name": "Eric Prydz", "rank": "#40 4 weeks", "order": 40, "image": "https://i.scdn.co/image/ab6761610000e5eb4170f1e4c72c0a9fc2eddc1d", "electronic": true, "found": true}, {"name": "ARTBAT", "rank": "#40 lifetime", "order": 40, "image": "https://i.scdn.co/image/ab6761610000e5eb2634ca41d16e9ba796dc96cb", "electronic": true, "found": true}, {"name": "Dennis Ferrer", "rank": "#41 4 weeks", "order": 41, "image": "https://i.scdn.co/image/ab6761610000e5eb32bb268d7a099f3024ba2909", "electronic": true, "found": true}, {"name": "Emanuel Satie", "rank": "#41 lifetime", "order": 41, "image": "https://i.scdn.co/image/ab6761610000e5eb1e909bf869a9567c0aafe1df", "electronic": true, "found": true}, {"name": "Kaz James", "rank": "#42 6 months", "order": 42, "image": "https://i.scdn.co/image/ab6761610000e5ebb6e0166d919e97b0e3591bac", "electronic": true, "found": true}, {"name": "Shakedown", "rank": "#42 lifetime", "order": 42, "image": "https://i.scdn.co/image/ab6761610000e5eb0e8ba9f6a3f505c77c013889", "electronic": true, "found": true}, {"name": "DAVI", "rank": "#43 lifetime", "order": 43, "image": "https://i.scdn.co/image/ab6761610000e5eb9457de52dd90785768de0b5e", "electronic": true, "found": true}, {"name": "Röyksopp", "rank": "#44 4 weeks", "order": 44, "image": "https://i.scdn.co/image/ab6761610000e5eb6bc3053447db6b61f3fe444c", "electronic": true, "found": true}, {"name": "Bob Sinclar", "rank": "#44 lifetime", "order": 44, "image": "https://i.scdn.co/image/ab6761610000e5eb9bf03e6d3ab7ceb543638845", "electronic": true, "found": true}, {"name": "Green Day", "rank": "#46 4 weeks", "order": 46, "image": "https://i.scdn.co/image/ab6761610000e5eb6ff0cd5ef2ecf733804984bb", "electronic": false, "found": true}, {"name": "Calvin Harris", "rank": "#46 lifetime", "order": 46, "image": "https://i.scdn.co/image/ab6761610000e5eb8ebba5e60113b48de8c11f6b", "electronic": true, "found": true}, {"name": "Agoria", "rank": "#47 4 weeks", "order": 47, "image": "https://i.scdn.co/image/ab6761610000e5ebb53a85c3c8ba03bc87698425", "electronic": true, "found": true}, {"name": "Bauhouse", "rank": "#47 6 months", "order": 47, "image": "https://i.scdn.co/image/ab6761610000e5ebd59d2c93d2067d5584255a47", "electronic": true, "found": true}, {"name": "Jungle", "rank": "#48 6 months", "order": 48, "image": "https://i.scdn.co/image/ab6761610000e5eb21f6e9ccd576bb2ef541a3fe", "electronic": true, "found": true}, {"name": "Tim Deluxe", "rank": "#50 6 months", "order": 50, "image": "https://i.scdn.co/image/ab6761610000e5eb73875cfd9e98d5eba500d286", "electronic": true, "found": true}, {"name": "Black Coffee", "rank": "added by you", "order": 999, "image": null, "electronic": true, "found": true}]};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (iso, o) => new Date(iso + "T12:00:00").toLocaleDateString("en-US", o);
const state = {tab: "cal", f: "e", pos: true};  // opens on Electronic; one tap shows everyone
try { Object.assign(state, JSON.parse(localStorage.getItem("cw2") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("cw2", JSON.stringify(state)); } catch (e) {} };

$("#sub").textContent = `Updated ${fmt(DATA.updated, {month: "short", day: "numeric"})} · ${DATA.artists.length} artists from your stats.fm`;

function visible(s) {
  if (!state.pos && s.fuzzy) return false;
  if (state.f === "e" && !s.electronic) return false;
  if (state.f === "o" && s.electronic) return false;
  return true;
}
const cls = s => s.fuzzy ? "f" : (s.electronic ? "e" : "");
const who = s => (s.matched || []).join(", ") || s.title;
const firstLink = s => { const l = s.links || {}; return l.RA || l.DICE || l.Ticketmaster || Object.values(l)[0]; };

function detail(s) {
  const links = Object.entries(s.links || {}).filter(([, u]) => u).map(([k, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(k)}</a>`).join(" · ");
  return `<h3 style="margin:0 0 4px">${esc(who(s))}${s.new ? '<span class="tag new">NEW</span>' : ""}${s.fuzzy ? '<span class="tag pos">POSSIBLE</span>' : ""}${s.electronic ? '<span class="tag dj">DJ</span>' : ""}</h3>
  <div class="meta">${esc((s.ranks || []).join(" · "))}</div>
  <p style="margin:10px 0 4px"><b>${esc(fmt(s.date, {weekday: "long", month: "long", day: "numeric"}))}</b>${s.start_time ? " · " + esc(s.start_time) : ""}</p>
  <div>${esc(s.venue || "")}${s.address ? `<div class="meta">${esc(s.address)}</div>` : ""}</div>
  ${s.title && s.matched?.length && s.title.toLowerCase() !== who(s).toLowerCase() ? `<div class="meta" style="margin-top:6px">${esc(s.title)}</div>` : ""}
  ${s.price ? `<div style="margin-top:6px">${esc(s.price)}</div>` : ""}
  ${s.on_sale ? `<div style="margin-top:4px"><b>${esc(s.on_sale)}</b></div>` : ""}
  <p style="margin:10px 0 0">${links}</p>`;
}
function showShow(key) { const s = DATA.shows.find(x => x.key === key); if (!s) return; $("#dlgBody").innerHTML = detail(s); $("#dlg").showModal(); }
document.addEventListener("click", e => { const el = e.target.closest("[data-key]"); if (el) { e.preventDefault(); showShow(el.dataset.key); } });

function calendar() {
  const nyc = DATA.shows.filter(s => s.region === "nyc" && visible(s));
  if (!nyc.length) return `<p class="empty-note">No NYC shows from your artists match these filters yet.</p>`;
  const byDay = {};
  nyc.forEach(s => (byDay[s.date] ||= []).push(s));
  const start = new Date(DATA.updated + "T12:00:00"); start.setDate(1);
  const last = new Date(nyc[nyc.length - 1].date + "T12:00:00");
  let html = "", agenda = "";
  for (let m = new Date(start); m <= last; m.setMonth(m.getMonth() + 1)) {
    const y = m.getFullYear(), mo = m.getMonth(), days = new Date(y, mo + 1, 0).getDate();
    const lead = (new Date(y, mo, 1).getDay() + 6) % 7;
    let cells = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => `<div class="dow">${d}</div>`).join("");
    cells += '<div class="cell empty"></div>'.repeat(lead);
    let monthAgenda = "";
    for (let d = 1; d <= days; d++) {
      const iso = `${y}-${String(mo + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const evs = byDay[iso] || [];
      cells += `<div class="cell${iso === DATA.updated ? " today" : ""}"><div class="num">${d}</div>${evs.map(s =>
        `<button class="ev ${cls(s)}" data-key="${esc(s.key)}">${esc(who(s))}<small>${esc(s.venue || "")}</small></button>`).join("")}</div>`;
      evs.forEach(s => monthAgenda += `<div class="item" data-key="${esc(s.key)}" style="cursor:pointer">
        <h3>${esc(who(s))}${s.new ? '<span class="tag new">NEW</span>' : ""}${s.fuzzy ? '<span class="tag pos">POSSIBLE</span>' : ""}${s.electronic ? '<span class="tag dj">DJ</span>' : ""}</h3>
        <div class="meta">${esc(fmt(iso, {weekday: "short", month: "short", day: "numeric"}))} · ${esc(s.venue || "")}</div></div>`);
    }
    const title = m.toLocaleDateString("en-US", {month: "long", year: "numeric"});
    html += `<section class="month grid-wrap"><h2>${title}</h2><div class="grid">${cells}</div></section>`;
    if (monthAgenda) agenda += `<section class="month agenda"><h2>${title}</h2>${monthAgenda}</section>`;
  }
  return html + agenda;
}

function artists() {
  const next = {};
  DATA.shows.filter(s => s.region === "nyc" && !s.fuzzy).forEach(s => (s.matched || []).forEach(n => next[n] ||= s));
  const counts = r => { const c = {}; DATA.shows.filter(s => s.region === r && !s.fuzzy).forEach(s => (s.matched || []).forEach(n => c[n] = (c[n] || 0) + 1)); return c; };
  const us = counts("us"), eu = counts("europe");
  const list = DATA.artists.filter(a => state.f === "all" || (state.f === "e") === a.electronic)
    .sort((a, b) => (next[a.name] ? 0 : 1) - (next[b.name] ? 0 : 1) || a.order - b.order);
  return `<div class="artists">${list.map(a => {
    const n = next[a.name];
    const line = n ? `<a href="#" data-key="${esc(n.key)}">NYC ${esc(fmt(n.date, {month: "short", day: "numeric"}))} · ${esc(n.venue || "")}</a>`
      : (a.found ? "No NYC date yet" : "No upcoming dates found");
    return `<div class="artist">${a.image ? `<img src="${esc(a.image)}" alt="" loading="lazy">` : '<div class="ph"></div>'}
      <div><b>${esc(a.name)}</b><div class="meta">${esc(a.rank)}${a.electronic ? " · DJ" : ""}</div>
      <div class="meta">${line}</div><div class="meta">${us[a.name] ? us[a.name] + " US" : ""}${us[a.name] && eu[a.name] ? " · " : ""}${eu[a.name] ? eu[a.name] + " Europe" : ""}</div></div></div>`;
  }).join("")}</div>`;
}

function tours() {
  const out = [];
  for (const [r, title] of [["us", "US tour dates"], ["europe", "Europe (FYI)"]]) {
    const by = {};
    DATA.shows.filter(s => s.region === r && visible(s) && !s.fuzzy).forEach(s => (s.matched || []).forEach(n => (by[n] ||= []).push(s)));
    const rows = Object.entries(by).sort((a, b) => a[1][0].date.localeCompare(b[1][0].date)).map(([n, ss]) =>
      `<div class="item"><h3>${esc(n)}</h3><div class="meta">${ss.map(s => `<a href="${esc(firstLink(s))}" target="_blank" rel="noopener">${esc(s.city || s.area || s.venue)} ${esc(fmt(s.date, {month: "short", day: "numeric"}))}</a>`).join(" · ")}</div></div>`).join("");
    out.push(`<section class="month"><h2>${title}</h2>${rows || '<p class="empty-note">Nothing listed.</p>'}</section>`);
  }
  return out.join("");
}

function render() {
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === state.tab));
  document.querySelectorAll("#filters .chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.f === "pos" ? state.pos : c.dataset.f === state.f));
  $("#view").innerHTML = state.tab === "cal" ? calendar() : state.tab === "artists" ? artists() : tours();
  save();
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => { state.tab = t.dataset.tab; render(); });
document.querySelectorAll("#filters .chip").forEach(c => c.onclick = () => { if (c.dataset.f === "pos") state.pos = !state.pos; else state.f = c.dataset.f; render(); });
render();
</script>
</body>
</html>
